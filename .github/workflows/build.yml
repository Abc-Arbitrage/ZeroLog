name: Build
on: [ push, pull_request ]

env:
  DOTNET_NOLOGO: 1
  NUGET_CERT_REVOCATION_MODE: offline
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  TERM: xterm

  BUILD_ADDITIONAL_DOTNET_VERSIONS: |
    6.0.x
    7.0.x
    8.0.x
    9.0.x
    10.0.x

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: ${{ env.BUILD_ADDITIONAL_DOTNET_VERSIONS }}

      - name: Restore
        run: dotnet restore src/ZeroLog.slnx

      - name: Build
        run: dotnet build --configuration Release --no-restore src/ZeroLog.slnx

      - name: Pack
        run: dotnet pack --configuration Release --no-build src/ZeroLog.slnx

      - name: Test
        run: dotnet test --configuration Release --no-build --solution src/ZeroLog.slnx

      - name: Test Allocations
        run: ./src/ZeroLog.Tests.Allocation/run.ps1 --configuration Release --no-build

      - name: Test AOT
        run: dotnet publish src/ZeroLog.Tests.Aot --configuration Release --no-build --output ./bin/aot && ./bin/aot/ZeroLog.Tests.Aot.exe

      - name: Upload NuGet
        uses: actions/upload-artifact@v7
        with:
          name: NuGet
          path: output/*.nupkg
          archive: false

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: ${{ env.BUILD_ADDITIONAL_DOTNET_VERSIONS }}

      - name: Restore
        run: dotnet restore src/ZeroLog.slnx

      - name: Build
        run: dotnet build --configuration Release --no-restore src/ZeroLog.slnx

      - name: Test ZeroLog
        run: dotnet test --configuration Release --no-build --project src/ZeroLog.Tests/ZeroLog.Tests.csproj

      - name: Test Analyzers
        run: dotnet test --configuration Release --no-build --project src/ZeroLog.Analyzers.Tests/ZeroLog.Analyzers.Tests.csproj

      - name: Test Allocations
        run: ./src/ZeroLog.Tests.Allocation/run.ps1 --configuration Release --no-build
        shell: pwsh

      - name: Test AOT
        run: dotnet publish src/ZeroLog.Tests.Aot --configuration Release --no-build --output ./bin/aot && ./bin/aot/ZeroLog.Tests.Aot
